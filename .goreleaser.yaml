version: 2

builds:
  - id: youtrack
    main: ./cmd/youtrack
    binary: youtrack
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/UsingCoding/youtrack-cli/internal/version.Version={{.Version}}
      - -X github.com/UsingCoding/youtrack-cli/internal/version.Commit={{.Commit}}
      - -X github.com/UsingCoding/youtrack-cli/internal/version.Date={{.Date}}

archives:
  - ids: [youtrack]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
